<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1450" viewBox="0 0 1700 1450" role="img" aria-labelledby="title description">
  <title id="title">Warehouse transfer ERD</title>
  <desc id="description">Entity relationship diagram for warehouses, purchase receipts, warehouse transfers, and FIFO sale allocations. White background, black text, red relationship lines.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #333333; }
      .entity { fill: #ffffff; stroke: #222222; stroke-width: 2.5; }
      .entity-title { font-size: 19px; font-weight: 700; letter-spacing: .4px; }
      .field { font-size: 16px; }
      .key { font-size: 12px; font-weight: 700; fill: #333333; }
      .divider { stroke: #777777; stroke-width: 1.2; }
      .relation { fill: none; stroke: #c62828; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .cardinality { font-size: 14px; font-weight: 700; fill: #111111; }
      .relation-label { font-size: 14px; font-weight: 600; }
      .label-bg { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1700" height="1450" fill="#ffffff"/>
  <text x="60" y="58" class="title">Warehouse Transfer ERD</text>
  <text x="60" y="88" class="subtitle">Purchase receipts retain the original cost lot; transfers and sales record the warehouse where stock moved or was consumed.</text>

  <!-- Relationships are drawn behind the entity boxes. -->
  <path class="relation" d="M460 600 H620"/>
  <path class="relation" d="M800 270 V500"/>
  <path class="relation" d="M980 140 H1100 V205 H1220"/>
  <path class="relation" d="M900 270 V410 H1145 V325 H1220"/>
  <path class="relation" d="M1425 390 V680"/>
  <path class="relation" d="M1040 620 H1160 V790 H1220"/>
  <path class="relation" d="M820 770 V1040"/>
  <path class="relation" d="M460 1120 H620"/>
  <path class="relation" d="M600 235 H520 V1120 H620"/>

  <!-- Relationship labels and cardinalities. -->
  <text x="470" y="587" class="cardinality">1</text>
  <text x="588" y="587" class="cardinality">0..*</text>
  <text x="812" y="295" class="cardinality">1</text>
  <text x="812" y="490" class="cardinality">0..*</text>
  <rect x="1010" y="105" width="145" height="25" rx="4" class="label-bg"/>
  <text x="1015" y="123" class="relation-label">source warehouse</text>
  <text x="990" y="132" class="cardinality">1</text>
  <text x="1190" y="198" class="cardinality">0..*</text>
  <rect x="1000" y="365" width="178" height="25" rx="4" class="label-bg"/>
  <text x="1005" y="383" class="relation-label">destination warehouse</text>
  <text x="910" y="300" class="cardinality">1</text>
  <text x="1190" y="322" class="cardinality">0..*</text>
  <text x="1437" y="416" class="cardinality">1</text>
  <text x="1437" y="670" class="cardinality">1..*</text>
  <text x="1048" y="607" class="cardinality">1</text>
  <text x="1190" y="782" class="cardinality">0..*</text>
  <text x="832" y="795" class="cardinality">1</text>
  <text x="832" y="1032" class="cardinality">0..*</text>
  <text x="470" y="1107" class="cardinality">1</text>
  <text x="588" y="1107" class="cardinality">0..*</text>
  <rect x="492" y="700" width="115" height="25" rx="4" class="label-bg"/>
  <text x="498" y="718" class="relation-label">sold from</text>
  <text x="580" y="250" class="cardinality">1</text>
  <text x="580" y="1107" class="cardinality">0..*</text>

  <!-- WAREHOUSE -->
  <g>
    <rect x="600" y="110" width="380" height="160" rx="8" class="entity"/>
    <path d="M600 154 H980" class="divider"/>
    <text x="620" y="140" class="entity-title">WAREHOUSE</text>
    <text x="620" y="184" class="key">PK</text><text x="660" y="184" class="field">warehouse_id</text>
    <text x="660" y="214" class="field">name</text>
    <text x="660" y="244" class="field">is_active</text>
  </g>

  <!-- PURCHASE_DETAILS -->
  <g>
    <rect x="60" y="500" width="400" height="200" rx="8" class="entity"/>
    <path d="M60 544 H460" class="divider"/>
    <text x="80" y="530" class="entity-title">PURCHASE_DETAILS</text>
    <text x="80" y="574" class="key">PK</text><text x="120" y="574" class="field">detail_id</text>
    <text x="80" y="604" class="key">FK</text><text x="120" y="604" class="field">purchase_id</text>
    <text x="120" y="634" class="field">item_id, quantity</text>
    <text x="120" y="664" class="field">unit_price</text>
  </g>

  <!-- PURCHASE_RECEIPT -->
  <g>
    <rect x="620" y="500" width="420" height="270" rx="8" class="entity"/>
    <path d="M620 544 H1040" class="divider"/>
    <text x="640" y="530" class="entity-title">PURCHASE_RECEIPT</text>
    <text x="640" y="574" class="key">PK</text><text x="680" y="574" class="field">receipt_id</text>
    <text x="640" y="604" class="key">FK</text><text x="680" y="604" class="field">purchase_detail_id</text>
    <text x="640" y="634" class="key">FK</text><text x="680" y="634" class="field">warehouse_id (original)</text>
    <text x="680" y="664" class="field">received_quantity</text>
    <text x="680" y="694" class="field">received_at</text>
  </g>

  <!-- WAREHOUSE_TRANSFER -->
  <g>
    <rect x="1220" y="150" width="420" height="240" rx="8" class="entity"/>
    <path d="M1220 194 H1640" class="divider"/>
    <text x="1240" y="180" class="entity-title">WAREHOUSE_TRANSFER</text>
    <text x="1240" y="224" class="key">PK</text><text x="1280" y="224" class="field">transfer_id</text>
    <text x="1240" y="254" class="key">FK</text><text x="1280" y="254" class="field">from_warehouse_id</text>
    <text x="1240" y="284" class="key">FK</text><text x="1280" y="284" class="field">to_warehouse_id</text>
    <text x="1280" y="314" class="field">transfer_date</text>
  </g>

  <!-- WAREHOUSE_TRANSFER_DETAILS -->
  <g>
    <rect x="1220" y="680" width="420" height="220" rx="8" class="entity"/>
    <path d="M1220 724 H1640" class="divider"/>
    <text x="1240" y="710" class="entity-title">WAREHOUSE_TRANSFER_DETAILS</text>
    <text x="1240" y="754" class="key">PK</text><text x="1280" y="754" class="field">transfer_detail_id</text>
    <text x="1240" y="784" class="key">FK</text><text x="1280" y="784" class="field">transfer_id</text>
    <text x="1240" y="814" class="key">FK</text><text x="1280" y="814" class="field">receipt_id (purchase lot)</text>
    <text x="1280" y="844" class="field">quantity</text>
  </g>

  <!-- SALES_DETAILS -->
  <g>
    <rect x="60" y="1010" width="400" height="190" rx="8" class="entity"/>
    <path d="M60 1054 H460" class="divider"/>
    <text x="80" y="1040" class="entity-title">SALES_DETAILS</text>
    <text x="80" y="1084" class="key">PK</text><text x="120" y="1084" class="field">detail_id</text>
    <text x="80" y="1114" class="key">FK</text><text x="120" y="1114" class="field">sales_id</text>
    <text x="120" y="1144" class="field">item_id, quantity</text>
  </g>

  <!-- SALE_PURCHASE_ALLOCATION -->
  <g>
    <rect x="620" y="1040" width="460" height="300" rx="8" class="entity"/>
    <path d="M620 1084 H1080" class="divider"/>
    <text x="640" y="1070" class="entity-title">SALE_PURCHASE_ALLOCATION</text>
    <text x="640" y="1114" class="key">PK</text><text x="680" y="1114" class="field">allocation_id</text>
    <text x="640" y="1144" class="key">FK</text><text x="680" y="1144" class="field">sales_details_id</text>
    <text x="640" y="1174" class="key">FK</text><text x="680" y="1174" class="field">purchase_details_id</text>
    <text x="640" y="1204" class="key">FK</text><text x="680" y="1204" class="field">receipt_id</text>
    <text x="640" y="1234" class="key">FK</text><text x="680" y="1234" class="field">warehouse_id (sold from)</text>
    <text x="680" y="1264" class="field">allocated_qty</text>
  </g>

  <text x="60" y="1395" class="subtitle">Red lines show relationships. PK = primary key; FK = foreign key. Transfers use FIFO receipt lots; available stock is calculated from receipts, transfers, and sale allocations.</text>
</svg>
